name: Docker Programado DEV a las 13:15 Chile

on:
  schedule:
    # 13:15 de Chile en horario UTC-4 son las 17:15 UTC
    - cron: '15 17 * * *'
  workflow_dispatch: # Mantiene el botón para probarlo manualmente cuando quieras

jobs:
  ejecutar-docker-programado:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Construir la imagen de Docker
        run: docker build -t mi-app-python-programado .

      - name: Ejecutar el contenedor Docker
        run: docker run --rm mi-app-python-programado
